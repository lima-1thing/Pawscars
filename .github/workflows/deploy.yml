name: Deploy Pawscars Preview to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Google Cloud backend dependencies
        run: npm ci --prefix gcloud-functions

      - name: Test Google Cloud backend
        run: npm test --prefix gcloud-functions

      - name: Run mini program, integration and simulation tests
        run: npm test

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build web test version
        run: |
          npm ci --prefix web
          npm run build --prefix web

      # 站点根目录：网页测试版（web/dist）；/demo/：早期单机演示版（preview/）
      - name: Assemble site
        run: |
          mkdir -p site/demo
          cp -r web/dist/. site/
          cp -r preview/. site/demo/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
